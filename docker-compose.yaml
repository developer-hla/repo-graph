services:
  repo-graph:
    build: .
    command: pixi run serve --host 0.0.0.0 --port 8000 --config ${REPO_GRAPH_CONFIG:-/app/config/local-example.yaml}
    environment:
      REPO_GRAPH_CONFIG: ${REPO_GRAPH_CONFIG:-/app/config/local-example.yaml}
      REPO_GRAPH_NEO4J_URI: bolt://neo4j:7687
      REPO_GRAPH_NEO4J_USER: neo4j
      REPO_GRAPH_NEO4J_PASSWORD: repo-graph-password
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
    ports:
      - "${REPO_GRAPH_API_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config:ro
      - ./examples:/app/examples:ro
      - repo_graph_output:/app/.repo-graph
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/repo-graph-password
    ports:
      - "${REPO_GRAPH_NEO4J_HTTP_PORT:-7475}:7474"
      - "${REPO_GRAPH_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p repo-graph-password "RETURN 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  repo_graph_output:
