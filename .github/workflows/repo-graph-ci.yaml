name: repo-graph-ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.53.0
      - name: Install locked Pixi environment
        run: pixi install --locked
      - name: Run audit
        run: pixi run audit
      - name: Check UI JavaScript syntax
        run: pixi run ui-check
