name: local-example
cache_dir: ../.repo-graph/cache/repos
output_dir: ../.repo-graph/output

sources:
  - type: local_path
    name: api-service
    path: ../examples/api-service

  - type: local_path
    name: shared-library
    path: ../examples/shared-library

  - type: local_path
    name: inventory-service
    path: ../examples/inventory-service

  - type: local_path
    name: python-shared
    path: ../examples/python-shared

  - type: local_path
    name: python-worker
    path: ../examples/python-worker

  - type: local_path
    name: dotnet-service
    path: ../examples/dotnet-service

  - type: local_path
    name: legacy-vb-service
    path: ../examples/legacy-vb-service

  - type: local_path
    name: database-project
    path: ../examples/database-project

include:
  file_extensions:
    - .asmx
    - .config
    - .json
    - .csproj
    - .props
    - .sln
    - .sql
    - .toml
    - .ts
    - .vb
    - .vbproj

exclude:
  directories:
    - .git
    - node_modules
    - dist
    - build
    - coverage
