<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repo Graph</title>
    <link rel="stylesheet" href="/ui/assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">RG</div>
          <div>
            <div class="brand-name">Repo Graph</div>
            <div class="runtime-state" id="runtime-state">checking</div>
          </div>
        </div>
        <nav class="nav-list" aria-label="Main navigation">
          <a href="#overview" data-route="overview">Overview</a>
          <a href="#search" data-route="search">Search</a>
          <a href="#impact" data-route="impact">Blast Radius</a>
          <a href="#unresolved" data-route="unresolved">Unresolved</a>
          <a href="#database" data-route="database">Database</a>
          <a href="#jobs" data-route="jobs">Jobs</a>
        </nav>
        <div class="sidebar-footer">
          <span>API</span>
          <code id="api-base">local</code>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="page-title">Overview</h1>
            <div class="page-meta" id="page-meta"></div>
          </div>
          <div class="topbar-actions">
            <form class="global-search" data-form="global-search">
              <input name="globalQuery" placeholder="Search entities" aria-label="Search entities" />
              <button class="button secondary" type="submit">Search</button>
            </form>
            <button class="icon-button" id="refresh-button" type="button" title="Refresh" aria-label="Refresh">
              &#8635;
            </button>
          </div>
        </header>
        <section class="view" id="app-view" aria-live="polite"></section>
      </main>
    </div>
    <script src="/ui/assets/api-client.js"></script>
    <script src="/ui/assets/formatters.js"></script>
    <script src="/ui/assets/components.js"></script>
    <script src="/ui/assets/markup.js"></script>
    <script src="/ui/assets/relationship-markup.js"></script>
    <script src="/ui/assets/operations-markup.js"></script>
    <script src="/ui/assets/report-markup.js"></script>
    <script src="/ui/assets/routing.js"></script>
    <script src="/ui/assets/actions.js"></script>
    <script src="/ui/assets/events.js"></script>
    <script src="/ui/assets/views.js"></script>
    <script src="/ui/assets/app.js"></script>
  </body>
</html>
